<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        ComicCraft - AI Comic Story Creator
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="/"
                class="logo"
            >
                🎨 ComicCraft
            </a>

            <span class="tagline">
                AI Comic Story Creator
            </span>

        </div>

    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>
            ComicCraft — AI-powered storytelling
        </p>
    </footer>

    <script
        src="{{ url_for('static', path='js/app.js') }}"
    ></script>

</body>

</html>
